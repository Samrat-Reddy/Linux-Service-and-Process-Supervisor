# Warden service configuration
#
# format:  <name>  <policy>  <mem_mb>  <command>  [arguments...]
#
#   policy   always     restart whenever the service stops
#            onfailure  restart only on non-zero exit or signal death
#            never      never restart
#   mem_mb   address-space limit applied with setrlimit(), 0 = unlimited

web        always     0    ./testsvc  long
worker     onfailure  0    ./testsvc  fail   4
batch      onfailure  0    ./testsvc  ok     3
crasher    always     0    ./testsvc  crash  6
